<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipos · Cabecera móvil</title>
<style>
@import url('../../src/styles/global.css');
body{display:block;background:#e9dfcf;padding:24px}
h1.t{font-size:1.5rem;margin:0 0 4px} .hint{margin:0 0 16px;color:#5b4a42}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.bar button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--color-primary);background:#fff;color:var(--color-primary);font-weight:600;cursor:pointer}.bar button[aria-pressed=true]{background:var(--color-primary);color:#fff}
.wall{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;background:var(--color-background);border:10px solid #2a1512;border-radius:34px;overflow:hidden;box-shadow:0 8px 24px rgb(0 0 0/.25)}
.phone figcaption{background:#2a1512;color:#fff;font:600 .8rem/1.3 var(--font-body);padding:6px 12px 10px}
.fake-header{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:var(--color-background);border-bottom:1px solid var(--color-border)}
.fake-header img{height:54px;width:auto}.burger{display:grid;gap:6px;width:32px}.burger i{display:block;height:3px;background:var(--color-primary);border-radius:2px}
.body-fake{padding:16px;color:var(--color-muted-foreground);font-size:.9rem}.body-fake i{display:block;height:10px;background:var(--color-muted);border-radius:5px;margin-bottom:8px}
.ph h1{margin:0;font-size:1.9rem}.ph p{margin:0;font-size:1.02rem;color:var(--color-muted-foreground)}

/* 1 · Logo arriba, todo centrado */
.v1 .ph{background:#fff;border-bottom:1px solid var(--color-border);padding:24px 16px;text-align:center}
.v1 .ph img{width:64px;margin:0 auto 10px}.v1 .ph h1{margin-bottom:6px}
/* 2 · Sin logo, filete de color */
.v2 .ph{background:#fff;border-bottom:1px solid var(--color-border);padding:24px 16px 22px;text-align:center}
.v2 .ph img{display:none}.v2 .ph h1{margin-bottom:6px}.v2 .ph .text::after{content:'';display:block;width:56px;height:4px;border-radius:2px;background:var(--color-primary);margin:14px auto 0}
/* 3 · Banda de color con texto blanco, logo en pastilla */
.v3 .ph{background:var(--color-primary);color:#fff;padding:22px 16px;display:flex;gap:14px;align-items:center}
.v3 .ph img{flex:none;width:58px;height:58px;padding:7px;background:var(--color-background);border-radius:50%}
.v3 .ph h1{color:#fff;font-size:1.65rem;margin-bottom:4px}.v3 .ph p{color:rgb(255 255 255/.88);font-size:.95rem}
/* 4 · Marca de agua grande a la derecha */
.v4 .ph{position:relative;overflow:hidden;background:var(--color-muted);border-bottom:1px solid var(--color-border);padding:26px 16px}
.v4 .ph img{position:absolute;right:-28px;top:50%;width:150px;transform:translateY(-50%);opacity:.22}.v4 .ph .text{position:relative;max-width:78%}.v4 .ph h1{margin-bottom:6px}
/* 5 · Logo pequeño solo con el título; el subtítulo a ancho completo */
.v5 .ph{background:#fff;border-bottom:1px solid var(--color-border);padding:20px 16px}
.v5 .ph{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.v5 .ph img{width:44px}.v5 .ph .text{display:contents}.v5 .ph h1{font-size:1.6rem;margin:0}.v5 .ph p{grid-column:1/-1;margin-top:10px}
/* 6 · Banda oscura con logo completo en blanco arriba */
.v6 .ph{background:#3a1a15;color:#fff;padding:22px 16px;text-align:center}
.v6 .ph img{display:none}.v6 .ph::before{content:'';display:block;width:90px;height:75px;margin:0 auto 10px;background:url('../../public/img/logo-completo-texto-blanco.webp') center/contain no-repeat}
.v6 .ph h1{color:#fff;font-size:1.7rem;margin-bottom:6px}.v6 .ph p{color:rgb(255 255 255/.85);font-size:.95rem}
/* 7 · Logo a la izquierda con filete vertical y texto alineado a la izquierda */
.v7 .ph{background:#fff;border-bottom:1px solid var(--color-border);padding:22px 16px;display:flex;gap:14px;align-items:stretch}
.v7 .ph img{flex:none;width:52px;align-self:flex-start}.v7 .ph .text{border-left:3px solid var(--color-primary);padding-left:14px}.v7 .ph h1{font-size:1.65rem;margin-bottom:4px}.v7 .ph p{font-size:.95rem}
</style></head><body>
<h1 class="t">Cabecera de página · móvil</h1>
<p class="hint">Cada teléfono mide 390 px de ancho (con la cabecera real del sitio arriba). El escritorio se queda como está.</p>
<div class="bar" id="bar"></div><div class="wall" id="wall"></div>
<script>
const M=[
 ['v1','1 · Logo arriba, todo centrado','Cabecera clásica centrada: el logo manda y el texto respira.'],
 ['v2','2 · Sin logo + filete de color','El nav ya lleva el logo; aquí solo un detalle rojo.'],
 ['v3','3 · Banda roja + logo en pastilla','Mucha identidad de color; texto en blanco.'],
 ['v4','4 · Logo como marca de agua','Fondo crema oscuro, logo grande y translúcido detrás.'],
 ['v5','5 · Logo pequeño junto al título','El logo solo acompaña al título; subtítulo a todo el ancho.'],
 ['v6','6 · Banda oscura + logo completo blanco','Contraste fuerte; usa el logo con texto en blanco.'],
 ['v7','7 · Logo + filete vertical','Logo a la izquierda y texto con barra de color.']];
const S=[['Iglesia y cementerio','Horarios y fotografías de la iglesia y el cementerio de Arbejales.'],['Documentos de la asociación','Estatutos, actas y memorias anuales.'],['Historia de Arbejales','']];
let s=0;const bar=document.getElementById('bar'),wall=document.getElementById('wall');
function draw(){[...bar.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===s));wall.innerHTML=M.map(([c,t,d])=>`<figure class="phone ${c}" style="margin:0"><div class="fake-header"><img src="../../public/img/logo-simbolo.png" alt=""><span class="burger"><i></i><i></i><i></i></span></div><div class="ph"><img src="../../public/img/logo-simbolo.png" alt=""><div class="text"><h1>${S[s][0]}</h1>${S[s][1]?`<p>${S[s][1]}</p>`:''}</div></div><div class="body-fake"><i></i><i style="width:90%"></i><i style="width:70%"></i></div><figcaption><b>${t}</b><br>${d}</figcaption></figure>`).join('')}
S.forEach((x,i)=>{const b=document.createElement('button');b.textContent='Ejemplo: '+x[0];b.onclick=()=>{s=i;draw()};bar.append(b)});draw();
</script></body></html>
