<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · Reproductor grande + lista</title><link rel="stylesheet" href="base.css"><style>

.a { display: grid; gap: var(--space-4); }
@media (min-width: 60rem) { .a { grid-template-columns: minmax(0,2fr) minmax(0,1fr); align-items: start; } .lista { max-height: 34rem; overflow: auto; } }
.actual h2 { margin: var(--space-3) 0 0; font-size: 1.15rem; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.item { display: grid; grid-template-columns: 7.5rem 1fr; gap: var(--space-3); width: 100%; text-align: left; padding: var(--space-2); border: 2px solid var(--color-border); border-radius: var(--radius); background: var(--color-card); cursor: pointer; align-items: center; min-height: 48px; }
.item[aria-current="true"] { border-color: var(--color-primary); background: var(--color-muted); }
.item .ratio { border-radius: 8px; } .item span.t { font-size: .9rem; line-height: 1.35; font-weight: 600; }
@media (max-width: 59.99rem) { .lista { grid-auto-flow: column; grid-auto-columns: 15rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: var(--space-2); } .item { grid-template-columns: 1fr; scroll-snap-align: start; } }

</style></head><body>
<div class="proto-bar"><span>A · Reproductor grande + lista</span><a href="index.html">← Todos los prototipos</a></div>
<div class="container section">
<h1 style="font-size:clamp(1.6rem,1rem+2vw,2.2rem)">Vídeos del Rancho de Ánimas</h1>
<div class="a"><div class="actual"><div class="ratio" id="p"></div><h2 id="titulo"></h2></div><ul class="lista" id="l" aria-label="Lista de vídeos"></ul></div>
</div>
<script src="datos.js"></script><script>

const l = document.getElementById("l"), p = document.getElementById("p"), h = document.getElementById("titulo");
function ver(i, auto) { const v = VIDEOS[i]; p.innerHTML = `<iframe src="${embed(v.id, auto)}" title="${v.t}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; h.textContent = v.t; [...l.children].forEach((li, j) => li.firstChild.setAttribute("aria-current", j === i)); }
VIDEOS.forEach((v, i) => { const li = document.createElement("li"); li.innerHTML = `<button class="item" type="button"><span class="ratio"><img src="${thumb(v.id)}" alt="" loading="lazy"></span><span class="t">${corto(v.t)}</span></button>`; li.firstChild.onclick = () => { ver(i, true); document.getElementById("p").scrollIntoView({behavior:"smooth",block:"nearest"}); }; l.append(li); });
ver(0, false);
</script></body></html>
