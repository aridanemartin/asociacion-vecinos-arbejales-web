<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Parrilla de miniaturas (se reproduce en su sitio)</title><link rel="stylesheet" href="base.css"><style>

.b { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); }
.b figure { margin: 0; } .b figcaption { padding: var(--space-3) var(--space-4) var(--space-4); font-weight: 600; font-size: .95rem; line-height: 1.4; }
.b .anio { display: inline-block; font-size: .75rem; letter-spacing: .04em; background: var(--color-muted); border: 1px solid var(--color-border); border-radius: 999px; padding: 1px 10px; margin-bottom: 6px; }
.facade { padding: 0; border: 0; display: block; width: 100%; cursor: pointer; }

</style></head><body>
<div class="proto-bar"><span>B · Parrilla de miniaturas (se reproduce en su sitio)</span><a href="index.html">← Todos los prototipos</a></div>
<div class="container section">
<h1 style="font-size:clamp(1.6rem,1rem+2vw,2.2rem)">Vídeos del Rancho de Ánimas</h1>
<div class="b" id="g"></div>
</div>
<script src="datos.js"></script><script>

const g = document.getElementById("g");
VIDEOS.forEach((v) => { const f = document.createElement("figure"); f.className = "card"; f.innerHTML = `<div class="ratio"><button class="facade ratio" type="button" aria-label="Reproducir: ${v.t}"><img src="${thumb(v.id)}" alt="" loading="lazy"><span class="play"></span></button></div><figcaption><span class="anio">${v.anio}</span><br>${corto(v.t)}</figcaption>`; f.querySelector("button").onclick = (e) => { f.querySelector(".ratio").innerHTML = `<iframe src="${embed(v.id, true)}" title="${v.t}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; }; g.append(f); });
</script></body></html>
